<!DOCTYPE html>
<html>
<head>
  <!-- Заменяется значением --base-href при flutter build. -->
  <base href="/shoplist/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shoplist — список покупок с ценами Mercadona и Lidl. Работает офлайн.">
  <meta name="theme-color" content="#F8F8F4">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Shoplist">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Shoplist</title>
  <link rel="manifest" href="manifest.json">

  <!-- Шрифты качаем параллельно с движком: без этого они стартовали только
       после загрузки wasm и добавляли секунды к первому кадру на мобильной
       сети. as="fetch" — так их и запрашивает Flutter, иначе не переиспользуются. -->
  <link rel="preload" href="assets/assets/fonts/GolosText-400.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/GolosText-500.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/GolosText-600.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/Oswald-500.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/Oswald-600.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/IBMPlexMono-400.ttf" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="assets/assets/fonts/ShoplistEmoji.ttf" as="fetch" crossorigin="anonymous">

  <style>
    html, body { height: 100%; margin: 0; background: #F8F8F4; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: #F8F8F4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 260ms ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    /* Та же иконка, что на главном экране телефона и в манифесте PWA:
       браузер, установленное приложение и сплэш выглядят одинаково. */
    #splash .logo {
      width: 88px; height: 88px; border-radius: 22px; display: block;
      box-shadow: 0 10px 28px rgba(32, 37, 34, 0.18);
      animation: pop 520ms cubic-bezier(.2, 1.4, .4, 1) both;
    }
    #splash .name {
      font-size: 22px; font-weight: 700; letter-spacing: 0.2px; color: #202522;
    }
    #splash .bar {
      width: 132px; height: 4px; border-radius: 2px; background: #E4E6E0; overflow: hidden;
    }
    #splash .bar span {
      display: block; width: 40%; height: 100%; border-radius: 2px; background: #F4C95D;
      animation: slide 1.1s ease-in-out infinite;
    }
    #splash .hint {
      min-height: 18px; font-size: 13px; color: #6B756F; text-align: center;
      max-width: 260px; opacity: 0; transition: opacity 400ms ease;
    }
    #splash .hint.on { opacity: 1; }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #splash .logo, #splash .bar span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img class="logo" src="icons/Icon-192.png" alt="">
    <div class="name" id="splash-name">Шоплист</div>
    <div class="bar"><span></span></div>
    <div class="hint" id="splash-hint"></div>
  </div>
  <script>
    (function () {
      // Язык сплэша — как у приложения: сохранённый выбор неизвестен до
      // старта Flutter, поэтому по языку браузера, по умолчанию украинский.
      var lang = (navigator.language || 'uk').slice(0, 2);
      var t = {
        uk: ['Шоплист', 'Повільне з’єднання — ще трохи. Наступного разу відкриється миттєво.'],
        ru: ['Шоплист', 'Медленное соединение — ещё немного. В следующий раз откроется мгновенно.'],
        es: ['Shoplist', 'Conexión lenta, un momento más. La próxima vez se abrirá al instante.'],
        en: ['Shoplist', 'Slow connection — almost there. Next time it opens instantly.'],
      }[lang] || null;
      t = t || ['Шоплист', 'Повільне з’єднання — ще трохи. Наступного разу відкриється миттєво.'];
      document.getElementById('splash-name').textContent = t[0];
      var hint = document.getElementById('splash-hint');
      var timer = setTimeout(function () { hint.textContent = t[1]; hint.className = 'hint on'; }, 5000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(timer);
        var s = document.getElementById('splash');
        if (!s) return;
        s.className = 'gone';
        setTimeout(function () { s.remove(); }, 300);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
